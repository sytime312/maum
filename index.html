<!DOCTYPE html>
<html lang="ko">

    <!-- Tailwind CSS -->

                extend: {

<body class="text-slate-700 min-h-screen flex flex-col justify-between">

    <!-- Top Header -->

                    <p class="text-[11px] text-slate-500">지친 너를 위한 따뜻한 한 줄 응원</p>

            </div>
            <div class="flex items-center gap-1.5">
                <button onclick="openAiModal()" class="bg-gradient-to-r from-emerald-400 to-teal-500 hover:opacity-90 text-white text-xs font-bold px-3 py-2 rounded-2xl transition-all shadow-md flex items-center gap-1.5 active:scale-95">
                    <i class="fa-solid fa-robot"></i> AI 상담소

                <button onclick="openFormModal()" class="bg-gradient-to-r from-lavender-500 to-pink-400 hover:opacity-90 text-white text-xs font-bold px-3.5 py-2 rounded-2xl transition-all shadow-md flex items-center gap-1.5 active:scale-95">

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto w-full flex-1 px-4 py-4 space-y-4">

        <!-- Banner Banner / Encouraging Daily Quote -->
        <section class="bg-white/90 backdrop-blur-sm rounded-3xl p-4 shadow-sm border border-lavender-200/80 relative overflow-hidden">
            <div class="absolute -right-4 -bottom-4 w-20 h-20 bg-lavender-100/60 rounded-full blur-xl pointer-events-none"></div>
            <div class="flex items-center gap-2 text-lavender-600 font-bold text-xs mb-1">
                <i class="fa-solid fa-sparkles text-amber-400"></i> 오늘의 힐링 한마디
            </div>
            <p class="font-handwriting text-xl text-slate-800 leading-snug mt-1" id="randomQuote">

            </p>
        </section>

        <!-- Mood & Color Filters -->
        <section class="space-y-2">
            <div class="flex items-center justify-between text-xs font-bold text-slate-600 px-1">
                <span class="flex items-center gap-1.5 text-slate-700">
                    <i class="fa-solid fa-note-sticky text-lavender-500"></i> 친구들의 마음 포스트잇
                </span>
                <span class="text-[11px] text-slate-400 font-normal" id="totalMsgCount">총 0개</span>
            </div>

            <!-- Emotion Filter Scroll -->
            <div class="flex items-center gap-1.5 overflow-x-auto hide-scrollbar py-1 text-xs">
                <button onclick="setMoodFilter('all')" class="mood-filter-btn whitespace-nowrap px-3.5 py-1.5 rounded-full border border-lavender-400 bg-lavender-500 text-white font-bold transition-all shadow-sm" data-mood="all">
                    🌱 전체 보기
                </button>
                <button onclick="setMoodFilter('happy')" class="mood-filter-btn whitespace-nowrap px-3.5 py-1.5 rounded-full border border-slate-200 bg-white text-slate-600 font-medium hover:bg-slate-50 transition-all" data-mood="happy">
                    😊 뿌듯함/기쁨
                </button>
                <button onclick="setMoodFilter('tired')" class="mood-filter-btn whitespace-nowrap px-3.5 py-1.5 rounded-full border border-slate-200 bg-white text-slate-600 font-medium hover:bg-slate-50 transition-all" data-mood="tired">
                    😮‍💨 피곤/지침
                </button>
                <button onclick="setMoodFilter('sad')" class="mood-filter-btn whitespace-nowrap px-3.5 py-1.5 rounded-full border border-slate-200 bg-white text-slate-600 font-medium hover:bg-slate-50 transition-all" data-mood="sad">
                    😢 우울/슬픔
                </button>
                <button onclick="setMoodFilter('stressed')" class="mood-filter-btn whitespace-nowrap px-3.5 py-1.5 rounded-full border border-slate-200 bg-white text-slate-600 font-medium hover:bg-slate-50 transition-all" data-mood="stressed">

        </section>

        <!-- Post-it Message Cards Feed -->
        <section id="messagesGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 pb-20">
            <!-- Cards rendered via JS -->
        </section>

    <!-- Floating Action Button for Mobile -->
    <div class="fixed bottom-6 right-5 z-20 max-w-md mx-auto flex flex-col gap-2 items-end">
        <button onclick="openAiModal()" class="w-12 h-12 bg-gradient-to-r from-emerald-400 to-teal-500 text-white rounded-full shadow-lg flex items-center justify-center text-lg transition-all hover:scale-105 active:scale-95">
            <i class="fa-solid fa-robot"></i>
        </button>
        <button onclick="openFormModal()" class="w-14 h-14 bg-gradient-to-r from-lavender-500 to-pink-400 text-white rounded-full shadow-lg flex items-center justify-center text-xl transition-all hover:scale-105 active:scale-95">

                <button onclick="closeAiModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 hover:text-slate-700 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Chat & Consultation Container -->
            <div class="p-5 overflow-y-auto space-y-4 flex-1">

                        <i class="fa-solid fa-robot text-base"></i>
                    </div>
                    <div class="text-xs text-slate-700 leading-relaxed">
                        <p class="font-bold text-teal-700 mb-0.5">안녕! 나는 너의 마음 상담사 '마음이'야 🌱</p>
                        학업, 친구 관계, 미래에 대한 어떤 고민이든 편하게 말해줘. 네 이야기를 따뜻하게 들어줄게.
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">고민 남기기</label>
                    <textarea id="aiWorryInput" rows="3" placeholder="예: 요즘 시험 성적 때문에 부모님 보기 죄송하고 스스로에게 실망스러워요..." class="w-full px-3.5 py-2.5 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-teal-400 focus:outline-none text-sm resize-none"></textarea>
                </div>

                <button onclick="askAiCounselor()" id="aiSubmitBtn" class="w-full py-3 bg-gradient-to-r from-teal-500 to-emerald-400 hover:opacity-95 text-white font-bold rounded-2xl shadow-md transition-all text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> 마음이에게 답변 듣기
                </button>

                <!-- AI Response Result Box -->
                <div id="aiResponseContainer" class="hidden space-y-2 pt-2">
                    <div class="text-xs font-bold text-slate-600 flex items-center gap-1.5">
                        <i class="fa-solid fa-heart text-rose-400"></i> 마음이의 따뜻한 답변
                    </div>
                    <div id="aiResponseBody" class="bg-gradient-to-br from-teal-50 to-emerald-50 border border-teal-200/60 rounded-2xl p-4 text-xs sm:text-sm text-slate-800 leading-relaxed font-medium">
                        <!-- AI Response content rendered here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Emotion Diary & Cheer Note Input Modal -->
    <div id="formModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden max-h-[92vh] flex flex-col animate-in slide-in-from-bottom duration-200">
            
            <!-- Modal Header -->
            <div class="px-5 py-4 border-b border-lavender-100 flex items-center justify-between bg-lavender-50/50">
                <h3 class="font-extrabold text-base text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-paper-plane text-lavender-500"></i>
                    마음 일기 & 응원 적기
                </h3>

                </button>
            </div>

                        <label class="cursor-pointer">
                            <input type="radio" name="moodRadio" value="happy" class="peer hidden" checked>

                                <div class="text-2xl">😊</div>
                                <div class="text-[11px] font-bold text-slate-600 mt-1">뿌듯함</div>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="moodRadio" value="tired" class="peer hidden">
                            <div class="p-2.5 rounded-2xl border-2 border-slate-100 text-center peer-checked:border-lavender-400 peer-checked:bg-lavender-50 transition-all">
                                <div class="text-2xl">😮‍💨</div>
                                <div class="text-[11px] font-bold text-slate-600 mt-1">지침</div>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="moodRadio" value="sad" class="peer hidden">
                            <div class="p-2.5 rounded-2xl border-2 border-slate-100 text-center peer-checked:border-lavender-400 peer-checked:bg-lavender-50 transition-all">
                                <div class="text-2xl">😢</div>
                                <div class="text-[11px] font-bold text-slate-600 mt-1">우울함</div>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="moodRadio" value="stressed" class="peer hidden">
                            <div class="p-2.5 rounded-2xl border-2 border-slate-100 text-center peer-checked:border-lavender-400 peer-checked:bg-lavender-50 transition-all">
                                <div class="text-2xl">🔥</div>
                                <div class="text-[11px] font-bold text-slate-600 mt-1">스트레스</div>
                            </div>

                    <label class="block text-xs font-bold text-slate-700 mb-1">오늘의 한 줄 일기 <span class="text-rose-400">*</span></label>
                    <input type="text" id="inputDiary" required placeholder="예: 야자 끝나고 집 가는 길인데 너무 힘드네 ㅠㅠ" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-lavender-400 focus:outline-none text-sm">
                </div>

                <!-- Cheer Message for classmates -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">친구들에게 전하는 따뜻한 응원 한마디 <span class="text-rose-400">*</span></label>
                    <textarea id="inputCheer" required rows="3" placeholder="예: 다들 시험 공부하느라 고생 많아! 조금만 힘내자 아자아자!" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-lavender-400 focus:outline-none text-sm resize-none"></textarea>
                </div>

                <!-- Post-it Color Picker -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">포스트잇 색상 선택</label>
                    <div class="flex items-center gap-3">
                        <label class="cursor-pointer flex items-center gap-1">
                            <input type="radio" name="colorRadio" value="yellow" class="peer hidden" checked>
                            <span class="w-7 h-7 rounded-full bg-yellow-100 border-2 border-transparent peer-checked:border-amber-400 peer-checked:scale-110 transition-all inline-block"></span>
                            <span class="text-xs text-slate-500">노랑</span>
                        </label>
                        <label class="cursor-pointer flex items-center gap-1">
                            <input type="radio" name="colorRadio" value="pink" class="peer hidden">
                            <span class="w-7 h-7 rounded-full bg-pink-100 border-2 border-transparent peer-checked:border-pink-400 peer-checked:scale-110 transition-all inline-block"></span>
                            <span class="text-xs text-slate-500">분홍</span>
                        </label>
                        <label class="cursor-pointer flex items-center gap-1">
                            <input type="radio" name="colorRadio" value="purple" class="peer hidden">
                            <span class="w-7 h-7 rounded-full bg-purple-100 border-2 border-transparent peer-checked:border-purple-400 peer-checked:scale-110 transition-all inline-block"></span>
                            <span class="text-xs text-slate-500">연보라</span>
                        </label>
                        <label class="cursor-pointer flex items-center gap-1">
                            <input type="radio" name="colorRadio" value="green" class="peer hidden">
                            <span class="w-7 h-7 rounded-full bg-green-100 border-2 border-transparent peer-checked:border-green-400 peer-checked:scale-110 transition-all inline-block"></span>
                            <span class="text-xs text-slate-500">민트</span>
                        </label>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit" class="w-full py-3 bg-gradient-to-r from-lavender-500 to-pink-400 hover:opacity-95 text-white font-bold rounded-2xl shadow-md transition-all text-sm">
                        익명으로 포스트잇 붙이기 ✨
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800/90 backdrop-blur-md text-white text-xs px-4 py-3 rounded-2xl shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2 z-50 whitespace-nowrap">
        <i class="fa-solid fa-heart text-pink-400 text-base"></i>
        <span id="toastMsg">마음 포스트잇이 등록되었습니다!</span>
    </div>

    <script>
        // 5 Warm Sample Initial Data
        let messages = [
            {
                id: 1,
                mood: "tired",
                moodText: "지침",

                cheer: "맞아 소소한 행복이 진짜 큰 힘이 되더라 ㅎㅎ 내일도 맛있는 거 먹고 같이 웃자!",

        window.onload = function() {
            // Pick a random quote
            const randIdx = Math.floor(Math.random() * quotes.length);
            document.getElementById('randomQuote').innerText = quotes[randIdx];

            renderMessages();
        };

        // Render Cards List
        function renderMessages() {
            const grid = document.getElementById('messagesGrid');

            const filtered = messages.filter(item => {
                return currentMoodFilter === 'all' || item.mood === currentMoodFilter;
            });

            document.getElementById('totalMsgCount').innerText = `총 ${messages.length}개`;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full bg-white/80 rounded-3xl p-8 text-center border border-lavender-100">
                        <div class="w-12 h-12 bg-lavender-50 rounded-full flex items-center justify-center mx-auto mb-2 text-lavender-400">
                            <i class="fa-regular fa-comment-dots text-xl"></i>
                        </div>
                        <p class="text-sm font-bold text-slate-600">아직 등록된 마음 카드가 없어요.</p>
                        <p class="text-xs text-slate-400 mt-1">첫 번째 마음 작성자가 되어주세요!</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(item => {
                const bgClass = getColorBgClass(item.color);
                const borderClass = getBorderClass(item.color);

                return `
                    <article class="postit-card ${bgClass} ${borderClass} border p-4 rounded-2xl relative flex flex-col justify-between" style="transform: rotate(${item.rotate || 0}deg);">
                        <!-- Pin Icon -->
                        <div class="absolute -top-2 left-1/2 -translate-x-1/2 text-rose-400 text-sm opacity-80">
                            <i class="fa-solid fa-thumbtack"></i>
                        </div>

                        <div>
                            <!-- Header Info -->
                            <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-900/5">
                                <span class="text-xs font-bold text-slate-700 flex items-center gap-1">
                                    <span class="text-base">${item.emoji}</span> ${item.moodText}
                                </span>
                                <span class="text-[10px] text-slate-400">${item.date}</span>
                            </div>

                            <!-- Diary Section -->
                            <div class="mb-3">
                                <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">오늘의 기분</p>
                                <p class="text-xs font-medium text-slate-700 mt-0.5 leading-relaxed">
                                    "${escapeHtml(item.diary)}"
                                </p>
                            </div>

                            <!-- Cheer Section -->
                            <div class="bg-white/60 backdrop-blur-xs rounded-xl p-2.5 border border-white/80">
                                <p class="text-[11px] font-bold text-lavender-600 flex items-center gap-1">
                                    <i class="fa-solid fa-heart text-[10px]"></i> 남기는 응원
                                </p>
                                <p class="font-handwriting text-lg text-slate-800 leading-snug mt-0.5">
                                    ${escapeHtml(item.cheer)}
                                </p>
                            </div>
                        </div>

                        <!-- Card Footer -->
                        <div class="pt-3 mt-2 flex items-center justify-between text-xs">
                            <span class="text-[11px] text-slate-400 font-medium">익명의 친구</span>
                            <div class="flex items-center gap-1.5">
                                <button onclick="deleteMessage(${item.id})" title="포스트잇 삭제" class="text-slate-400 hover:text-rose-500 bg-white/70 p-1.5 rounded-full border border-slate-200/80 shadow-xs active:scale-95 transition-all">
                                    <i class="fa-regular fa-trash-can text-xs"></i>
                                </button>
                                <button onclick="addLike(${item.id})" class="flex items-center gap-1 text-rose-500 hover:text-rose-600 bg-white/70 px-2.5 py-1 rounded-full border border-rose-100 shadow-xs active:scale-95 transition-transform">
                                    <i class="fa-solid fa-heart text-xs"></i>
                                    <span class="font-bold text-xs">${item.likes}</span>
                                </button>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        // Color mapper helpers
        function getColorBgClass(color) {
            switch(color) {
                case 'pink': return 'bg-pastelPink';
                case 'purple': return 'bg-pastelPurple';
                case 'green': return 'bg-pastelGreen';
                default: return 'bg-pastelYellow';
            }
        }
        function getBorderClass(color) {
            switch(color) {
                case 'pink': return 'border-pink-200';
                case 'purple': return 'border-purple-200';
                case 'green': return 'border-green-200';
                default: return 'border-yellow-200';
            }
        }

        // Mood Filter Selector
        function setMoodFilter(mood) {
            currentMoodFilter = mood;
            const buttons = document.querySelectorAll('.mood-filter-btn');
            
            buttons.forEach(btn => {
                if (btn.getAttribute('data-mood') === mood) {
                    btn.className = "mood-filter-btn whitespace-nowrap px-3.5 py-1.5 rounded-full border border-lavender-400 bg-lavender-500 text-white font-bold transition-all shadow-sm";
                } else {
                    btn.className = "mood-filter-btn whitespace-nowrap px-3.5 py-1.5 rounded-full border border-slate-200 bg-white text-slate-600 font-medium hover:bg-slate-50 transition-all";
                }
            });

            renderMessages();
        }

        // Form Submit Handler
        function handleFormSubmit(e) {
            e.preventDefault();

            const moodVal = document.querySelector('input[name="moodRadio"]:checked').value;
            const diary = document.getElementById('inputDiary').value.trim();
            const cheer = document.getElementById('inputCheer').value.trim();
            const color = document.querySelector('input[name="colorRadio"]:checked').value;

            let emoji = "😊";
            let moodText = "뿌듯함";
            if (moodVal === 'tired') { emoji = "😮‍💨"; moodText = "지침"; }
            if (moodVal === 'sad') { emoji = "😢"; moodText = "우울함"; }
            if (moodVal === 'stressed') { emoji = "🔥"; moodText = "스트레스"; }

            // Random subtle rotation for sticky note style
            const rot = (Math.random() * 4 - 2).toFixed(1);

            const newItem = {
                id: Date.now(),
                mood: moodVal,
                moodText: moodText,
                emoji: emoji,
                diary: diary,
                cheer: cheer,
                color: color,
                rotate: rot,
                likes: 1,
                date: "방금 전"
            };

            messages.unshift(newItem);
            renderMessages();
            closeFormModal();
            document.getElementById('diaryForm').reset();
            showToast("따뜻한 포스트잇 메시지가 전달되었습니다 💌");
        }

        // Add Heart Like
        function addLike(id) {
            const item = messages.find(m => m.id === id);
            if (item) {
                item.likes += 1;
                renderMessages();
            }
        }

        // Delete Post-it Card
        function deleteMessage(id) {
            messages = messages.filter(m => m.id !== id);
            renderMessages();
            showToast("포스트잇이 삭제되었습니다.");
        }

        // AI Counselor Functions
        function openAiModal() {
            document.getElementById('aiModal').classList.remove('hidden');
        }

        function closeAiModal() {
            document.getElementById('aiModal').classList.add('hidden');
        }

        async function askAiCounselor() {
            const worryText = document.getElementById('aiWorryInput').value.trim();
            if (!worryText) {
                showToast("고민 내용을 입력해주세요!");
                return;
            }

            const btn = document.getElementById('aiSubmitBtn');
            const responseContainer = document.getElementById('aiResponseContainer');
            const responseBody = document.getElementById('aiResponseBody');

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 마음이가 생각하고 있어요...`;

            responseContainer.classList.remove('hidden');
            responseBody.innerHTML = `<span class="text-slate-400 flex items-center gap-2"><i class="fa-solid fa-circle-notch fa-spin"></i> 너의 마음을 공감하며 답변을 작성 중이야...</span>`;

            try {
                const systemPrompt = "너는 청소년을 친절하고 따뜻하게 상담해주는 AI 친구이자 전문 상담사 '마음이'야. 청소년의 고민에 다정하고 따뜻하게 존댓말로 공감해주고, 마음의 부담을 덜어줄 만한 용기와 솔루션을 2~3문단으로 다정하게 제시해줘. 반말하지 말고 항상 따뜻한 존댓말과 응원의 말투를 사용해.";
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const payload = {
                    contents: [{ parts: [{ text: worryText }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;

                if (text) {
                    responseBody.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');
                } else {
                    responseBody.innerText = "마음이가 잠시 조언을 정리하는 중 오류가 생겼어. 잠시 후 다시 시도해줘!";
                }
            } catch (error) {
                console.error(error);
                responseBody.innerText = "네트워크 연결에 문제가 있거나 답변을 불러올 수 없어. 다시 시도해줘!";
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> 마음이에게 답변 듣기`;
            }
        }

        // Modal Controls
        function openFormModal() {
            document.getElementById('formModal').classList.remove('hidden');
        }

        function closeFormModal() {
            document.getElementById('formModal').classList.add('hidden');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Toast Helper
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
